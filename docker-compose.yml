services:

  tomcat:
    image: tomcat:10.1-jdk21
    container_name: mvc-saas-tomcat

    ports:
      - "8081:8080"

    environment:
      API_BASE_URL: ${API_BASE_URL:-http://host.docker.internal:8080/intercambiolivros/api}

    volumes:
      - ./deploy/intercambiolivros.war:/usr/local/tomcat/webapps/intercambiolivros.war
